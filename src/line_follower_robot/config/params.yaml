# =============================================================================
# Line Follower Robot — Configuration Parameters
# =============================================================================

line_tracker_node:
  ros__parameters:
    # ── PID Controller Gains ──────────────────────────────────────────
    # Kp: proportional — main steering response (lower = less wobble)
    kp: 0.3
    # Ki: integral — corrects small constant offset (keep low!)
    ki: 0.0
    # Kd: derivative — dampens oscillation / wobble (higher = smoother)
    kd: 0.2

    # ── Camera Offset Compensation ────────────────────────────────────
    # Waffle camera is ~4.7cm right of robot center. This shifts the
    # image target point so the robot body (not camera) tracks the line.
    # Increase if robot still tracks to one side, decrease if overcorrected.
    camera_offset_pixels: 25

    # ── Derivative Low-Pass Filter ────────────────────────────────────
    # Smooths the D term to prevent jitter/wobble (0.0-1.0)
    # Lower = smoother but slower response, higher = noisier but faster
    derivative_filter_alpha: 0.3

    # ── Dynamic Speed ─────────────────────────────────────────────────
    # Fast on straights, slow on curves
    max_speed: 0.22
    min_speed: 0.08
    # Higher = more aggressive slowdown on curves
    speed_sensitivity: 2.5

    # ── Vision Pipeline ───────────────────────────────────────────────
    # Fraction of image top to crop (0.6 = use bottom 40%)
    crop_top_ratio: 0.60
    # Grayscale threshold for black line detection (0-255)
    black_threshold: 100
    # Minimum moment area to consider as valid line (filters noise)
    min_contour_area: 500

    # ── Line Lost Recovery ────────────────────────────────────────────
    recovery_linear_speed: 0.05
    recovery_angular_speed: 0.3

obstacle_detector_node:
  ros__parameters:
    # Detect obstacles at this distance (meters) — triggers avoidance
    obstacle_distance_threshold: 0.50
    # Emergency stop distance — critically close
    emergency_distance_threshold: 0.25
    # Front arc to scan (degrees, each side from center)
    front_arc_degrees: 40.0
    # Side arc for clearance checking during bypass
    side_check_arc_degrees: 90.0

navigation_controller_node:
  ros__parameters:
    # Brief stop before starting avoidance (seconds)
    stop_duration: 0.5
    # Turn speed for avoidance maneuver (rad/s)
    turn_speed: 0.6
    # Time to turn ~90° at turn_speed (tune this!)
    turn_duration_90: 2.5
    # Forward speed during bypass
    forward_speed: 0.15
    # Drive forward to clear beside obstacle (seconds)
    bypass_forward_duration: 1.5
    # Drive forward past the obstacle (seconds)
    approach_line_duration: 2.5
    # Speed when searching for line after bypass
    return_speed: 0.12
    # Give up searching after this long
    return_timeout: 8.0
    # Start slowing down at this distance (meters)
    slowdown_distance: 0.60
    # Reduced speed when approaching obstacle
    slowdown_speed: 0.08

